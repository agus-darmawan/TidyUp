name: iOS Build & Test

# Runs on every push/PR. Requires the TidyUp.xcodeproj (created locally
# in Xcode) to be committed to the repo, with a "TidyUpTests" unit test
# target added — see README.md "Running Tests" for the one-time setup.
#
# Uses the xcode-27 runner image (public preview) since this project's
# .pbxproj was saved in Xcode 27's project format — older runner images
# (macos-15, which only has up to Xcode 16.x) can't open it.
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: xcode-27

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project TidyUp.xcodeproj \
            -scheme TidyUp \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest'
